<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Météo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        .btn:hover {
            
            background-image: linear-gradient(to right, #40c4ff, #80d8ff, #e0f7ff) !important;
            
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15); /* Ombre douce sous le bouton */
            color: #002752 !important;
        }

        #title {
            background-color: #b5e6f7;
            border-radius: 25px;
            margin-left: 100px;
            margin-right: 100px;
            
        }

        li {
            list-style-type: none;
            font-weight: bold;
        }
    </style>


    
</head>

<body class="bg-light d-flex justify-content-center align-items-center min-vh-100 m-0 pt-3 pt-sm-5 pb-2">
    
    <div class="card p-3 p-sm-4 shadow border-0 rounded-4 position-relative" style="max-width: 480px; width: 100%;">

        <!-- Toast Flottant à cheval sur le bord supérieur -->
        <div class="toast-container position-fixed top-0 start-50 translate-middle-x z-3" style="width: 85%; max-width: 400px;">
            <div id="toast-meteo" class="toast align-items-center text-bg-success border-0 shadow" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="d-flex">
                    <div class="toast-body p-2 text-center w-100" id="toast-message" style="font-size: 12px;">
                        <!-- Le texte dynamique s'affichera ici -->
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
            </div>
        </div>


        <h4 class="text-center position-absolute start-50 translate-middle-x" style="top: -19px;"><span class="badge rounded-pill bg-info"><i class="bi bi-cloud-sun me-2"></i>METEO</span></h4>
        

        <!-- Barre de recherche complète -->
        <form id="rock">
            <div class="input-group mb-3 mt-3">
                <input type="text" class="form-control" placeholder="Entrez le nom d'une ville..." id="ville" required>
                <button class="btn" type="submit" id="button-addon2" style="background-image: linear-gradient(to right, #e0f7ff, #80d8ff, #40c4ff); color: #000; border: none;"><i class="bi bi-search me-1 me-sm-2"></i><span class="d-none d-sm-inline">Rechercher</span></button>
            </div>
        </form>
            
        <!-- Le bloc météo masqué viendra se placer juste ici plus tard -->
        <div id="bloc-meteo" class="d-none mt-3">
            <!-- Contenu des résultats -->
            
                
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>   
    
    <script>
        const formulaire = document.getElementById("rock");
        const bouton = document.getElementById("button-addon2");
        const input = document.getElementById("ville");
        const carteMeteo = document.getElementById("bloc-meteo");

        async function obtenirmeteo(ville) {

            try {
                const reponse = await fetch(`https://wttr.in/${encodeURIComponent(ville)}?format=j1`);
                
                if (!reponse.ok) {
                    throw new Error (`Erreur HTTP (code ${reponse.status})`);
                }

                
                const donnees = await reponse.json();
                const country = donnees.nearest_area?.[0]?.country?.[0]?.value || "Indisponible";
                const area = donnees.nearest_area?.[0]?.region?.[0]?.value || "Indisponible";
                const town = donnees.nearest_area?.[0]?.areaName?.[0]?.value || "Indisponible";
                const temp = donnees.current_condition?.[0]?.temp_C || "Indisponible";
                const cold = donnees.current_condition?.[0]?.humidity || "Indisponible";
                const wind = donnees.current_condition?.[0]?.windspeedKmph || "Indisponible";
                const description = donnees.current_condition?.[0]?.lang_fr?.[0]?.value || donnees.current_condition?.[0]?.weatherDesc?.[0]?.value || "Non disponible";
                const luck = donnees?.weather?.[0]?.hourly?.[0]?.chanceofrain || "0";


                carteMeteo.innerHTML = `
                    <div class="d-flex flex-column gap-3 gap-sm-3">

                        <!--Pays-->
                        <div class="d-flex overflow-hidden align-items-stretch rounded-3 ms-2 me-2 ms-sm-2 me-sm-2" >
                            <div class="row w-50 g-0 bg-info align-items-center p-2 p-sm-3">
                                <div class="col-3 text-center">
                                    <i class="bi bi-globe-americas text-light fs-5"></i>
                                </div>
                                <div class="col-9 p-0">
                                    <p class="text-light m-0" style="font-weight: bold; font-size: 15px;">Pays:</p>
                                </div>
                            </div>
                            <div class="w-50 bg-light d-flex align-items-center justify-content-center p-2 p-sm-3">
                                <p class="text-info fw-semibold text-center m-0">${country}</p>
                            </div>
                        </div>
                        
                        <!--Region-->
                        <div class="d-flex overflow-hidden align-items-stretch rounded-3 ms-1 me-1 ms-sm-2 me-sm-2" >
                            <div class="row w-50 g-0 bg-info align-items-center p-2 p-sm-3">
                                <div class="col-3 text-center">
                                    <i class="bi bi-map-fill text-light fs-5"></i>
                                </div>
                                <div class="col-9 p-0">

                                    <p class="text-light m-0" style="font-weight: bold; font-size: 15px;">Région:</p>
                                </div>
                            </div>
                            <div class="w-50 bg-light d-flex align-items-center justify-content-center p-2 p-sm-3">
                                <p class="text-info text-center fw-semibold m-0">${area}</p>
                            </div>
                        </div>

                        <!--Ville-->
                        <div class="d-flex overflow-hidden align-items-stretch rounded-3 ms-1 me-1 ms-sm-2 me-sm-2" >
                            <div class="row w-50 g-0 bg-info align-items-center p-2 p-sm-3">
                                <div class="col-3 text-center">
                                    <i class="bi bi-geo-alt-fill text-light fs-5"></i>
                                </div>
                                <div class="col-9 p-0">
                                    <p class="text-light m-0" style="font-weight: bold; font-size: 15px;">Ville:</p>
                            
                                </div>
                            </div>
                            <div class="w-50 bg-light d-flex align-items-center justify-content-center p-2 p-sm-3">
                                <p class="text-info text-center fw-semibold m-0">${town}</p>
                            </div>
                        </div>

                        <!--Température-->
                        <div class="d-flex overflow-hidden align-items-stretch rounded-3 ms-1 me-1 ms-sm-2 me-sm-2" >
                            <div class="row w-50 g-0 bg-info align-items-center p-2 p-sm-3" >
                                <div class="col-3 text-center">
                                    <i class="bi bi-thermometer-half text-light fs-5"></i>
                                </div>
                                <div class="col-9 p-0">
                                    <p class="text-light m-0" style="font-weight: bold; font-size: 15px;">Température:</p>
                                </div>
                            </div>
                            <div class="w-50 bg-light d-flex align-items-center justify-content-center p-2 p-sm-3">
                                <p class="text-info text-center fw-semibold m-0">${temp}${temp !=="Indisponible" ? "°C" : ""}</p>
                            </div>
                        </div>

                        <!--Humidité-->
                        <div class="d-flex overflow-hidden align-items-stretch rounded-3 ms-1 me-1 ms-sm-2 me-sm-2" >
                            <div class="row w-50 g-0 bg-info align-items-center p-2 p-sm-3">
                                <div class="col-3 text-center">
                                    <i class="bi bi-droplet text-light fs-5"></i>
                                </div>
                                <div class="col-9 p-0">
                                
                                    <p class=" text-light m-0" style="font-weight: bold; font-size: 15px;">Humidité:</p>
                            
                                </div>
                            </div>
                            <div class="w-50 bg-light d-flex align-items-center justify-content-center p-2 p-sm-3">
                                <p class="text-info text-center fw-semibold m-0">${cold}${cold !=="Indisponible" ? "%" : ""}</p>
                            </div>
                        </div>

                        <!--Vent-->
                        <div class="d-flex overflow-hidden align-items-stretch rounded-3 ms-1 me-1 ms-sm-2 me-sm-2" >
                            <div class="row w-50 g-0 bg-info align-items-center p-2 p-sm-3">
                                <div class="col-3 text-center">
                                    <i class="bi bi-wind text-light fs-5"></i>
                                </div>
                                <div class="col-9 p-0">
                                    <p class="text-light m-0" style="font-weight: bold; font-size: 15px;">Vent:</p>
                                </div>
                            </div>
                            <div class="w-50 bg-light d-flex align-items-center justify-content-center p-2 p-sm-3">
                                <p class="text-info text-center fw-semibold m-0">${wind}${wind !=="Indisponible" ? "km/h" : ""}</p>
                            </div>
                        
                        </div>

                        <div class="rounded-3 w-100 h-auto align-items-center justify-content-center" style="background-image: linear-gradient(to bottom, #40c4ff, #80d8ff, #e0f7ff);">
                            <p class="p-3 mb-0 fw-bold" style="font-size: 17px;">Cette ville est sous la condition suivante: <strong>${description}</strong> avec <strong>${luck}%</strong> de risque de pluie.</p>
                        </div> 
            
                    </div>
                `
                carteMeteo.classList.remove("d-none");

                // Mise à jour du message et déclenchement du Toast
                const toastMessage = document.getElementById("toast-message");
                const date = donnees.weather?.[0]?.date;
                const hour = donnees.current_condition?.[0]?.observation_time;
                if (date && hour) {
                    toastMessage.innerHTML = `<i class="bi bi-check-circle-fill me-1"></i> Données du ${date} à ${hour} UTC`;

                } else {
                    toastMessage.innerHTML = `<i class="bi bi-check-circle-fill me-1"></i> Données météo récupérées avec succès`;
                }

                const toastElement = document.getElementById("toast-meteo");
                const toast = new bootstrap.Toast(toastElement, { delay: 3000 });
                toast.show();

            } catch (error) {
                carteMeteo.innerHTML = `
                    <div class="alert alert-danger d-flex align-items-center" role="alert">
                        <i class="bi bi-exclamation-triangle-fill fs-4 me-2"></i>
                        <div>Erreur. Veuillez vérifier le nom de la ville et réessayer.</div>
                    </div>
                `
                carteMeteo.classList.remove("d-none");

            }

            
            
        }

        formulaire.addEventListener("submit", (e) => {
            e.preventDefault();

            if (input.value.trim() !== "") {
                obtenirmeteo(input.value.trim());
            }
        })
    </script>

</body>
</html>
