<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        .btn:hover {
            
            background-image: linear-gradient(to right, #40c4ff, #80d8ff, #e0f7ff) !important;
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15); /* Ombre douce sous le bouton */
            color: #002752 !important;
        }

        #title {
            background-color: #b5e6f7;
            border-radius: 25px;
            margin-left: 100px;
            margin-right: 100px;
            
        }

        li {
            list-style-type: none;
            font-weight: bold;
        }
    </style>


    
</head>

<body class="bg-light d-flex justify-content-center align-items-center min-vh-100 m-0">
    
    <div class="card p-4 shadow border-0 rounded-4" style="max-width: 450px; width: 100%;">
        <h4 class="text-center mb-3"><span class="badge rounded-pill bg-info"><i class="bi bi-cloud-sun me-2"></i>METEO</span></h4>

        <!-- Barre de recherche complète -->

        <div class="input-group mb-3">
            <input type="text" class="form-control" placeholder="Entrez le nom d'une ville..." id="ville">
            <button class="btn" type="button" id="button-addon2" style="background-image: linear-gradient(to right, #e0f7ff, #80d8ff, #40c4ff); color: #000; border: none;"><i class="bi bi-search me-2"></i>Rechercher</button>
        </div>
        <!-- Le bloc météo masqué viendra se placer juste ici plus tard -->
        <div id="bloc-meteo" class="d-none mt-3 text-center">
            <!-- Contenu des résultats -->
             <ul>
                <li>Pays: <span><p id="country"></p></span></li>
                <li>Région: <span><p id="area"></p></span></li>
                <li>Nom de la ville: <span><p id="name"></p></span></li>
                <li>Température: <span><p id="temperature"></p></span></li>
                <li>Humidité: <span><p id="humidity"></p></span></li>
                <li>Vent: <span><p id="wind"></p></span></li>
            </ul>
        </div>
    </div>


    <script>
        const bouton = document.getElementById("button-addon2");
        const input = document.getElementById("ville");
        const country = document.getElementById("country");
        const area = document.getElementById("area");
        const nom = document.getElementById("name");
        const temp = document.getElementById("temperature");
        const humi = document.getElementById("humidity");
        const air = document.getElementById("wind");
        const carteMeteo = document.getElementById("bloc-meteo");


        

        

        async function obtenirmeteo(ville) {

            try {
                const reponse = await fetch(`https://wttr.in/${encodeURIComponent(ville)}?format=j1`);
                const donnees = await reponse.json();

                country.textContent = donnees.nearest_area[0].country[0].value;
                
                nom.textContent = donnees.nearest_area[0].areaName[0].value;

                area.textContent = donnees.nearest_area[0]?.region[0].value;
                
                temp.textContent = `${donnees.current_condition[0].temp_C}°C`;
                humi.textContent = donnees.current_condition[0].humidity;
                air.textContent = `${donnees.current_condition[0].windspeedKmph}km/h`;

                
                carteMeteo.classList.remove("d-none");

            } catch (error) {
                alert("Erreur lors de la récupération des données. Veuillez vérifier le nom de la ville.");
                carteMeteo.classList.remove("d-none");

            }

            
            
        }

        bouton.addEventListener("click", () => {
            if (input.value !== "") {
                obtenirmeteo(input.value);
            }
            
        
            
        })
    </script>
</body>
</html>
