<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Météo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="meteo.css">


    
</head>

<body class=" d-flex justify-content-center align-items-center min-vh-100 m-0 pt-3 pt-sm-5 pb-2">
    
    <div class="card p-3 p-sm-4 shadow border-0 rounded-4 position-relative" id="sky">

        <!-- Toast Flottant à cheval sur le bord supérieur -->
        <div class="toast-container position-fixed top-0 start-50 translate-middle-x z-3" id="toast-start">
            <div id="toast-meteo" class="toast align-items-center text-bg-success border-0 shadow" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="d-flex">
                    <div class="toast-body p-2 text-center w-100" id="toast-message">
                        <!-- Le texte dynamique s'affichera ici -->
                   </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
            </div>
        </div>


        <h4 class="text-center position-absolute start-50 translate-middle-x" id="title"><span class="badge rounded-pill bg-info"><i class="bi bi-cloud-sun me-2"></i>METEO</span></h4>
        

        <!-- Barre de recherche complète -->
        <form id="rock">
            <div class="input-group mb-3 mt-3">
                <input type="text" class="form-control" placeholder="Entrez le nom d'une ville..." id="ville" required>
                <button class="btn" type="submit" id="button-addon2" ><i class="bi bi-search me-1 me-sm-2"></i><span class="d-none d-sm-inline">Rechercher</span></button>
            </div>
        </form>
            
        <!-- Le bloc météo masqué viendra se placer juste ici plus tard -->
        <div id="bloc-meteo" class="d-none mt-3">
            <!-- Contenu des résultats -->
            
                
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>   
    
    <script src="meteo.js"></script>
        
    

</body>
</html>
